document.addEventListener('click', (ev) => {
  const dialogBtn = ev.target.closest('[data-dialog-act]');
  if (dialogBtn) {
    const dAct = dialogBtn.dataset.dialogAct;
    if (activeDialog) {
      const cb = dAct === 'confirm' ? activeDialog.onConfirm : activeDialog.onCancel;
      closeConfirm();
      if (cb) cb();
    } else {
      closeConfirm();
    }
    return;
  }
  if (ev.target.classList.contains('inapp-dialog-backdrop')) {
    if (activeDialog && activeDialog.onCancel) activeDialog.onCancel();
    closeConfirm();
    return;
  }

  const studyEditBtn = ev.target.closest('[data-study-edit-act]');
  if (studyEditBtn) {
    const act = studyEditBtn.dataset.studyEditAct;
    if (act === 'cancel') {
      closeConfirm();
    } else if (act === 'save') {
      const d = studyEditBtn.dataset.date || today();
      saveManualStudyTime(d);
    }
    return;
  }

  const salatBtn = ev.target.closest('[data-salat-act]');
  if (salatBtn) {
    const sAct = salatBtn.dataset.salatAct;
    if (sAct === 'cancel') {
      closeConfirm();
    } else if (sAct === 'save') {
      const h = Number($('salatHour').value);
      const min = Number($('salatMin').value);
      const ampm = $('salatAmPm').value;
      let h24 = h % 12;
      if (ampm === 'PM') h24 += 12;
      const newTimeStr = String(h24).padStart(2, '0') + ':' + String(min).padStart(2, '0');

      const prayers = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
      const curTimes = { ...(person().settings.salatTimes || { fajr: '05:50', dhuhr: '13:20', asr: '16:00', maghrib: '17:20', isha: '19:30' }) };
      curTimes[editingSalatPrayer] = newTimeStr;

      const mins = prayers.map(pr => {
        const [hh, mm] = curTimes[pr].split(':').map(Number);
        return hh * 60 + mm;
      });

      let inOrder = true;
      for (let i = 0; i < mins.length - 1; i++) {
        if (mins[i] >= mins[i + 1]) {
          inOrder = false;
          break;
        }
      }

      if (!inOrder) {
        toast('Times must be in order');
        return;
      }

      person().settings.salatTimes = curTimes;
      save();
      window.Device?.sync(JSON.stringify(E.plan(state, person())));
      closeConfirm();
      toast('Prayer time updated');
      render();
    }
    return;
  }

  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const { act: a, val: v } = el.dataset;

  if (a === 'prevDua') {
    if (currentDuaIdx > 0) {
      currentDuaIdx--;
      render();
    }
    return;
  }
  if (a === 'nextDua') {
    const maxIdx = (window.duas?.length || 4) - 1;
    if (currentDuaIdx < maxIdx) {
      currentDuaIdx++;
      render();
    }
    return;
  }
  if (a === 'permCard') {
    if (v === 'notifications') window.Device?.permission();
    else if (v === 'timing') window.Device?.timing();
    else if (v === 'battery') window.Device?.battery();
    else if (v === 'usage') window.Device?.requestUsagePermission();
    return;
  }
  if (a === 'appSelectAll') {
    const s = person().settings;
    const apps = getInstalledApps();
    s.redirectApps = apps.map((x) => x.packageName);
    save();
    window.Device?.updateRedirectApps?.(JSON.stringify(s.redirectApps));
    render();
    return;
  }
  if (a === 'appDeselectAll') {
    const s = person().settings;
    s.redirectApps = [];
    save();
    window.Device?.updateRedirectApps?.(JSON.stringify(s.redirectApps));
    render();
    return;
  }
  if (a === 'sendTestNotification') {
    if (window.Device) Device.testNotification();
    else toast("Test notification scheduled for 10s (Requires Android app)");
    return;
  }
  if (a === 'editSalatTime') {
    openSalatPicker(v);
    return;
  }

  if (a === 'go' || a === 'nav') {
    if (['calendar', 'attendance'].includes(v) && v !== page) date = today();
    go(v, a === 'nav');
    return;
  }
  if (a === 'attCourse') {
    attendanceCode = v;
    go('attendanceDetail');
    return;
  }
  if (a === 'libraryTab') {
    libraryTab = v;
    render();
    return;
  }
  if (a === 'routineDay') {
    date = v;
    mode = 'day';
    render();
    return;
  }
  if (a === 'tapMark' || a === 'clearMark') {
    const [day, id] = v.split('|');
    const m = E.meetings(state, sec(), day).find((x) => x.id === id);
    if (!m) return;
    const mark =
      a === 'clearMark' ? 'clear' : E.markOf(person(), m) === 'present' ? 'absent' : 'present';
    if (E.markMeeting(state, person(), m, mark, now())) {
      save();
      render();
      Array.from(document.querySelectorAll('[data-act=tapMark]'))
        .find((b) => b.dataset.val === v)
        ?.focus({ preventScroll: true });
      // Toast suppressed for instant one-tap attendance marking
    }
    return;
  }
  if (a === 'quickMark') {
    const meetingId = el.dataset.meeting;
    const value = el.dataset.val;
    const t = today();
    const meeting = E.meetings(state, sec(), t).find((m) => m.id === meetingId);
    if (!meeting) return;
    const curMark = E.markOf(person(), meeting);
    const nextVal = (curMark === value) ? 'clear' : value;
    E.markMeeting(state, person(), meeting, nextVal, now());
    save();
    render();
    // Toast suppressed for instant one-tap attendance marking
    return;
  }
  if (a === 'openQuizEdit') {
    selectedQuizId = v;
    go('quizEditSingle');
    return;
  }
  if (a === 'deleteSingleQuiz') {
    showConfirm('Are you sure you want to delete this quiz?', () => {
      const idx = state.events.findIndex((e) => e.id === v);
      if (idx !== -1) {
        state.events.splice(idx, 1);
        save();
        window.Device?.sync(JSON.stringify(E.plan(state, person())));
        toast('Quiz deleted');
        go('home', true);
      }
    });
    return;
  }
  if (a === 'deleteQuizFromList') {
    showConfirm('Are you sure you want to delete this quiz?', () => {
      const idx = state.events.findIndex((e) => e.id === v);
      if (idx !== -1) {
        state.events.splice(idx, 1);
        save();
        window.Device?.sync(JSON.stringify(E.plan(state, person())));
        toast('Quiz deleted');
        render();
      }
    });
    return;
  }
  if (a === 'saveAllQuizzes') {
    const cards = document.querySelectorAll('.quiz-manage-card');
    cards.forEach((card) => {
      const qid = card.dataset.quizId;
      const q = state.events.find((e) => e.id === qid);
      if (q) {
        const dateInput = card.querySelector('[data-quiz-field="date"]');
        const timeInput = card.querySelector('[data-quiz-field="time_display"]');
        const roomAInput = card.querySelector('[data-quiz-field="roomA"]');
        const roomBInput = card.querySelector('[data-quiz-field="roomB"]');
        const sylInput = card.querySelector('[data-quiz-field="syllabus"]');
        
        if (dateInput && dateInput.value) q.date = dateInput.value;
        if (timeInput && timeInput.value) {
          q.time_display = timeInput.value;
          const pt = QuizParser.parseTime(timeInput.value);
          if (pt.minute != null) q.minute = pt.minute;
        }
        q.rooms = q.rooms || {};
        if (roomAInput) q.rooms.A = roomAInput.value.trim();
        if (roomBInput) q.rooms.B = roomBInput.value.trim();
        if (sylInput) q.syllabus = sylInput.value.trim();
      }
    });
    save();
    window.Device?.sync(JSON.stringify(E.plan(state, person())));
    toast('All quizzes saved');
    render();
    return;
  }
  if (a === 'toggleTodo') {
    toggleTodoItem(v);
    return;
  }
  if (a === 'deleteTodo') {
    const p = person();
    p.todos = (p.todos || []).filter((t) => t.id !== v);
    save();
    render();
    toast('Task deleted');
    return;
  }
  if (a === 'todoTab') {
    todoFilter = v;
    render();
    return;
  }
  if (a === 'clearCompleted') {
    showConfirm('Are you sure you want to clear all completed tasks?', () => {
      const p = person();
      p.todos = (p.todos || []).filter((t) => !t.done);
      save();
      render();
      toast('Completed tasks cleared');
    }, null, 'Clear', true);
    return;
  }
  if (a === 'openAddResource') {
    editingResourceId = null;
    go('libraryAdd');
    return;
  }
  if (a === 'cancelLibraryAdd') {
    editingResourceId = null;
    go('library', true);
    return;
  }
  if (a === 'editCustomResource') {
    editingResourceId = v;
    go('libraryAdd');
    return;
  }
  if (a === 'deleteCustomResource') {
    showConfirm('Are you sure you want to delete this item?', () => {
      const idx = state.resources.findIndex((r) => r.id === v);
      if (idx !== -1) {
        state.resources.splice(idx, 1);
        save();
        render();
        toast('Link deleted');
      }
    });
    return;
  }
  if (a === 'external' || a === 'alternateLink') {
    const r = state.resources.find((r) => r.id === v);
    const url = r && (a === 'alternateLink' ? otherSuppliedLink(r)?.url : r.url);
    if (url && /^https?:\/\//i.test(url)) {
      if (window.Device) Device.open(url);
      else window.open(url, '_blank', 'noopener,noreferrer');
    }
    return;
  }
  if (a === 'switch') {
    switching = true;
    go('welcome');
    return;
  }
  if (a === 'theme') {
    state.theme = v;
    save();
    applyTheme();
    document
      .querySelectorAll('[data-act=theme]')
      .forEach((b) => b.setAttribute('aria-pressed', b.dataset.val === v));
    return;
  }
  if (a === 'studyYear' || a === 'studyMonth' || a === 'studyDay') {
    studyMode = { studyYear: 'year', studyMonth: 'month', studyDay: 'day' }[a];
    studyDate = v || today();
    go('study');
    return;
  }
  if (a === 'editStudyTime') {
    const targetDate = el.dataset.date || el.dataset.val || today();
    openStudyTimeEditor(targetDate);
    return;
  }
  if (a === 'timer') {
    const p = person();
    const f = p.focus;
    const s = p.settings;
    s.redirectApps = s.redirectApps || [
      'com.facebook.katana',
      'com.facebook.lite',
      'com.instagram.android',
      'com.google.android.youtube'
    ];
    if (v === 'start') {
      if (f.active || document.hidden) return;
      const token = newId();
      if (window.Device && !Device.begin(token)) return;
      f.token = token;
      E.focus(f, 'start', now());
      if (s.redirectProtection !== false && window.Device?.hasUsagePermission?.()) {
        window.Device?.updateRedirectApps?.(JSON.stringify(s.redirectApps));
        window.Device?.setAppBlocker?.(true);
      } else {
        window.Device?.setAppBlocker?.(false);
      }
    } else if (v === 'pause') {
      E.focus(f, 'pause', now());
      window.Device?.setAppBlocker?.(false);
    } else if (v === 'resume') {
      E.focus(f, 'resume', now());
      if (s.redirectProtection !== false && window.Device?.hasUsagePermission?.()) {
        window.Device?.updateRedirectApps?.(JSON.stringify(s.redirectApps));
        window.Device?.setAppBlocker?.(true);
      } else {
        window.Device?.setAppBlocker?.(false);
      }
    } else if (v === 'finish') {
      finishFocus();
      toast('Session saved');
    }
    save();
    render();
    return;
  }
  if (a === 'mode') {
    if (page === 'study') studyMode = v;
    else mode = v;
    render();
    return;
  }
  if (a === 'date' || a === 'today') {
    const chosen = a === 'today' ? today() : v;
    if (page === 'study') studyDate = chosen;
    else date = chosen;
    render();
    return;
  }
  if (['calstep', 'attstep', 'adminstep'].includes(a)) {
    step(Number(v), a === 'adminstep');
    return;
  }
  if (a === 'timing') {
    window.Device?.timing();
    return;
  }
  if (a === 'permission') {
    window.Device?.permission();
    return;
  }
  if (a === 'requestBlockerPerm') {
    window.Device?.requestUsagePermission();
    return;
  }
  if (a === 'loadQuizExample') {
    const example = `Quiz schedule of this week:\nMonday (23.11.26)\nCEE-4563\nSyllabus:Lecture 1,2-A, 2-B Math 2.1-2.6\nVenue: 101 (sect-A),102 (sect-B)\nTime: 1.00 pm.\n\nWednesday (25.11.26)\nCEE 4565\nSyllabus: Lecture 1-3\nVenue: 101 (sect-A),102 (sect-B)\nTime: 1.00 pm.\n\nThursday (26.11.26)\nCEE-4551\nSyllabus: week 01 & 02\nVenue: 101 (sect-A),102 (sect-B)\nTime: 1.00 pm.`;
    importRawText = example;
    const txtEl = $('quizImportText');
    if (txtEl) txtEl.value = example;
    return;
  }
  if (a === 'parseQuizNotice') {
    const txtEl = $('quizImportText');
    const raw = (txtEl ? txtEl.value : importRawText) || '';
    importRawText = raw;
    if (!raw.trim()) {
      toast('Please paste a notice first');
      return;
    }
    const result = QuizParser.parseOffline(raw, C);
    if (!result.ok || !result.quizzes.length) {
      toast(result.error || 'No quizzes found in text');
      return;
    }
    importParsedQuizzes = result.quizzes;
    importWarnings = result.warnings || [];
    render();
    return;
  }
  if (a === 'removeImportQuiz') {
    const idx = Number(v);
    importParsedQuizzes.splice(idx, 1);
    if (!importParsedQuizzes.length) {
      importWarnings = [];
    }
    render();
    return;
  }
  if (a === 'resetQuizImport') {
    importParsedQuizzes = [];
    importWarnings = [];
    render();
    return;
  }
  if (a === 'confirmQuizImport') {
    let savedCount = 0;
    for (const q of importParsedQuizzes) {
      const diff = QuizParser.detectDiff(q, state.events);
      if (diff.action === 'update') {
        const existing = state.events.find((e) => e.id === diff.targetId);
        if (existing) {
          existing.syllabus = q.syllabus;
          existing.minute = q.minute;
          existing.time_display = q.time_display;
          existing.rooms = q.rooms;
        }
      } else if (diff.action === 'reschedule') {
        const existing = state.events.find((e) => e.id === diff.targetId);
        if (existing) {
          existing.date = q.date;
          existing.syllabus = q.syllabus;
          existing.minute = q.minute;
          existing.time_display = q.time_display;
          existing.rooms = q.rooms;
          existing.id = q.id;
        }
      } else {
        state.events.push({
          id: q.id,
          code: q.code,
          title: q.code + ' · ' + (C[q.code]?.title || q.code),
          kind: 'Quiz',
          date: q.date,
          minute: q.minute,
          time_display: q.time_display,
          lead: 120,
          audience: 'Both',
          rooms: q.rooms,
          syllabus: q.syllabus,
          cancelled: false,
        });
      }
      savedCount++;
    }
    save();
    window.Device?.sync(JSON.stringify(E.plan(state, person())));
    importParsedQuizzes = [];
    importWarnings = [];
    importRawText = '';
    toast(`${savedCount} quizzes saved and reminders scheduled`);
    go('home');
    return;
  }
});

document.addEventListener('change', (ev) => {

    if (isChecked && idx === -1) {
      s.redirectApps.push(pkg);
    } else if (!isChecked && idx !== -1) {
      s.redirectApps.splice(idx, 1);
    }
    save();
    window.Device?.updateRedirectApps?.(JSON.stringify(s.redirectApps));
    const apps = getInstalledApps();

      item.done = el.checked;
      if (item.done) item.completedAt = now();

document.addEventListener('input', (ev) => {
  if (ev.target.id === 'appSearch') {
    const query = ev.target.value.toLowerCase().trim();
    const rows = document.querySelectorAll('.app-redirect-row');
    rows.forEach((r) => {
      const name = r.dataset.name || '';
      const pkg = (r.dataset.pkg || '').toLowerCase();

    });

        importParsedQuizzes[idx].rooms = importParsedQuizzes[idx].rooms || {};
        importParsedQuizzes[idx].rooms.A = ev.target.value;

        importParsedQuizzes[idx].rooms = importParsedQuizzes[idx].rooms || {};
        importParsedQuizzes[idx].rooms.B = ev.target.value;

        importParsedQuizzes[idx].time_display = ev.target.value;
        const parsed = QuizParser.parseTime(ev.target.value);

document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const formId = f.getAttribute('id');
  const data = new FormData(f);
  const val = (k) => String(data.get(k) || '').trim();
  const on = (k) => data.has(k);

  if (formId === 'todoForm') {
    const title = (f.todoTitle?.value || val('todoTitle')).trim();
    const due = f.todoDue?.value || val('todoDue');
    if (!title) return;
    const p = person();
    p.todos = p.todos || [];
    p.todos.unshift({
      id: 'todo-' + newId(),
      title,
      dueDate: due,
      done: false,
      createdAt: now(),
    });
    save();
    render();
    toast('Task added');
    return;
  }

  if (formId === 'singleQuizForm') {
    const q = state.events.find((e) => e.id === selectedQuizId);
    if (q) {
      const singleDate = val('singleDate');
      const singleTime = val('singleTime');
      const singleRoomA = val('singleRoomA');
      const singleRoomB = val('singleRoomB');
      const singleSyllabus = val('singleSyllabus');
      
      const parsedTime = QuizParser.parseTime(singleTime);
      q.date = singleDate || q.date;
      q.time_display = singleTime || q.time_display;
      if (parsedTime.minute != null) q.minute = parsedTime.minute;
      q.rooms = { A: singleRoomA, B: singleRoomB };
      q.syllabus = singleSyllabus;
      
      save();
      window.Device?.sync(JSON.stringify(E.plan(state, person())));
      toast('Quiz saved');
      go('home', true);
    }
    return;
  }

  if (formId === 'libraryAddForm') {
    let rawUrl = val('resUrl');
    if (!/^https?:\/\//i.test(rawUrl)) rawUrl = 'https://' + rawUrl;
    let urlObj;
    try {
      urlObj = new URL(rawUrl);
    } catch {
      toast('Please enter a valid URL');
      return;
    }
    if (urlObj.protocol !== 'http:' && urlObj.protocol !== 'https:') {
      toast('Only HTTP and HTTPS links are allowed');
      return;
    }
    const title = val('resTitle');
    if (!title) {
      toast('Please enter a title');
      return;
    }
    const courseCode = val('resCourse');
    const kind = libraryTab === 'Collections' ? 'Collection' : libraryTab === 'Recordings' ? 'Recording' : 'Material';
    if (kind !== 'Collection' && !courseCode) {
      toast('Please select a course');
      return;
    }
    const note = val('resNote');
    
    if (editingResourceId) {
      const r = state.resources.find((x) => x.id === editingResourceId);
      if (r) {
        r.title = title;
        r.url = rawUrl;
        r.codes = courseCode ? [courseCode] : [];
        r.note = note;
      }
    } else {
      state.resources.unshift({
        id: 'res-' + newId(),
        title,
        url: rawUrl,
        kind,
        codes: courseCode ? [courseCode] : [],
        note,
        custom: true,
        addedAt: now(),
      });
    }
    save();
    editingResourceId = null;
    toast('Saved to library');
    go('library', true);
    return;
  }

  if (formId === 'assignForm') {
    const id = val('id').replace(/\D/g, '');
    if (!/^\d{9}$/.test(id)) {
      return toast('Student ID will be 9 digits');
    }
    const key = E.profileKey(id),
      old = state.active;
    if (key !== old && state.people[key])
      return toast('That ID already has a profile. Open Student Profile to access it.');
    const p = person();
    if (key !== old) {
      state.people[key] = p;
      delete state.people[old];
      state.active = key;
    }
    E.identify(p, id);
    save();
    go('settings', true);
    toast('Student ID updated');
    return;
  }

  if (formId === 'profileForm') {
    const id = val('id').replace(/\D/g, '');
    if (!/^\d{9}$/.test(id)) {
      toast('Student ID will be 9 digits');
      return;
    }
    state.active = E.profileKey(id);
    state.people[state.active] ??= E.person(val('section'), now());
    E.identify(person(), id, val('section'));
    switching = false;
    adminOpen = false;
    date = today();
    save();
    if (person().focus.active) {
      person().focus.token ||= newId();
      window.Device?.begin(person().focus.token);
      save();
      go('focus', true);
    } else go('home', true);
    return;
  }

  if (formId === 'settingsForm' || formId === 'prefsForm') {
    if (!val('words')) {
      toast('Enter reminder wording');
      return;
    }
    Object.assign(person().settings, {
      threshold: Number(val('threshold')),
      classes: on('classes'),
      events: on('events'),
      lead: Number(val('lead')),
      salatLead: Number(val('salatLead') || 0),
      awake: on('awake'),
      dhikr: on('dhikr'),
      dhikrTime: val('dhikrTime'),
      words: val('words'),
      salatReminders: on('salatReminders'),
    });
    save();
    window.Device?.sync(JSON.stringify(E.plan(state, person())));
    render();
    toast('Settings saved');
    return;
  }
});

function newId() {
  const bytes = new Uint32Array(3);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, (x) => x.toString(36)).join('-');
}

function tick() {
  if (page === 'focus' && person()) {
    const f = person().focus;
    if (f.active && f.token) {
      const end = window.Device?.ended(f.token);
      if (end) {
        window.focusInterrupted(f.token, end);
        return;
      }
    }
    $('elapsed').textContent = duration(E.focusMs(f, now()));
    $('sum').textContent = duration(E.focusMs(f, now(), true));
  }
  if (
    Math.floor(now() / 60000) !== lastMinute &&
    ['home', 'attendance', 'attendanceDetail', 'notices'].includes(page) &&
    !document.activeElement?.matches('input,select,button,textarea')
  )
    render();
}

window.refreshDevice = () => {
  applyTheme();
  if ($('timingState') && window.Device)
    $('timingState').textContent = Device.precise()
      ? 'Precise alarm timing is available.'
      : 'Android may delay reminders. Allow alarms & reminders for precise timing.';
  if ($('permissionState') && window.Device)
    $('permissionState').textContent = Device.allowed()
      ? 'Allowed on this device'
      : 'Off in Android settings';
  tick();
};

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) window.refreshDevice();
});

matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);
recoverClosedSessions();
applyTheme();
setInterval(tick, 1000);
render();
sync();

<script>
/* Added: backup & restore, storage warning */
(function () {
  const say = (t) => { try { toast(t); } catch (e) { alert(t); } };
  const enc = () => btoa(unescape(encodeURIComponent(JSON.stringify({ app: 'iut-cee23', v: 1, data: state }))));
  function parse(txt) {
    txt = (txt || '').trim();
    let o;
    try { o = JSON.parse(txt); } catch (e) { o = JSON.parse(decodeURIComponent(escape(atob(txt)))); }
    const d = o && o.app === 'iut-cee23' ? o.data : o;
    if (!d || typeof d.people !== 'object') throw new Error('bad');
    return d;
  }
  function restore(txt) {
    let d;
    try { d = parse(txt); } catch (e) { return say('That backup is not valid. Paste the whole code or choose the .json file.'); }
    if (!confirm('Replace the progress on this device with this backup?')) return;
    state = d;
    state.theme ??= 'system';
    persist();
    location.reload();
  }
  function download() {
    const day = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'iut-cee23', v: 1, data: state })], { type: 'application/json' }));
    a.download = 'iut-cee-23-backup-' + day + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    say('Backup downloaded');
  }
  async function copy() {
    try { await navigator.clipboard.writeText(enc()); say('Backup code copied'); }
    catch (e) { const t = document.getElementById('ceeText'); document.getElementById('ceePanel').hidden = false; t.value = enc(); t.select(); say('Copy the code from the box'); }
  }
  function card(welcome) {
    const d = document.createElement('div');
    d.id = 'ceeBackup'; d.className = 'card stack';
    d.innerHTML = (welcome
      ? '<h3>Have a backup?</h3><p class="sub">Restore your attendance and settings on this device.</p><button type="button" class="secondary" data-cee="open">Restore from backup</button>'
      : '<h3>Back up your progress</h3><p class="sub">Your progress is saved only in this browser. Download a backup before you clear browser data or change phones.</p><div class="cee-actions"><button type="button" class="secondary" data-cee="download">Download backup</button><button type="button" class="secondary" data-cee="copy">Copy backup code</button><button type="button" class="secondary wide" data-cee="open">Restore from backup</button></div>')
      + '<div id="ceePanel" hidden><p class="sub">Choose a backup file, or paste a backup code.</p><input type="file" accept=".json,application/json" id="ceeFile"><textarea id="ceeText" placeholder="Paste backup code here"></textarea><button type="button" data-cee="restore">Restore progress</button></div>';
    return d;
  }
  function storageIssue() {
    try { if (window.top !== window.self) return true; } catch (e) { return true; }
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { return true; }
    return /FBAN|FBAV|FB_IAB|Messenger|Instagram|Line\//i.test(navigator.userAgent);
  }
  let busy = false;
  function enhance() {
    if (busy) return; busy = true;
    try {
      const m = document.getElementById('main'); if (!m) return;
      const pg = document.body.dataset.page;
      if (storageIssue() && !m.querySelector('#ceeWarn')) {
        const w = document.createElement('div'); w.id = 'ceeWarn';
        w.textContent = 'This page may not keep your progress. Open it directly in Chrome or Safari (not inside another app), and use Back up in Settings.';
        m.prepend(w);
      }
      if ((pg === 'settings' || pg === 'welcome') && !m.querySelector('#ceeBackup')) m.append(card(pg === 'welcome'));
    } finally { busy = false; }
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest && e.target.closest('[data-cee]'); if (!b) return;
    const k = b.dataset.cee;
    if (k === 'download') download();
    else if (k === 'copy') copy();
    else if (k === 'open') { const p = document.getElementById('ceePanel'); p.hidden = !p.hidden; }
    else if (k === 'restore') restore(document.getElementById('ceeText').value);
  });
  document.addEventListener('change', (e) => {
    if (e.target.id !== 'ceeFile' || !e.target.files[0]) return;
    const r = new FileReader(); r.onload = () => restore(String(r.result)); r.readAsText(e.target.files[0]);
  });
  const m = document.getElementById('main');
  if (m) new MutationObserver(enhance).observe(m, { childList: true });
  enhance();
})();
</script>
<script>
/* Central class data: loads data.json from the same site; edit that file to update everyone */
(function () {
  const merge = (key, trackKey, list) => {
    const ids = list.map((x) => x.id);
    const old = state[trackKey] || [];
    state[key] = (state[key] || []).filter((x) => !old.includes(x.id) || ids.includes(x.id));
    for (const item of list) {
      const i = state[key].findIndex((x) => x.id === item.id);
      if (i >= 0) state[key][i] = { ...state[key][i], ...item };
      else state[key].push({ ...item });
    }
    state[trackKey] = ids;
  };
  fetch('data.json?' + Date.now(), { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => {
      if (!j || typeof j !== 'object') return;
      if (j.catalog) Object.assign(SEED.catalog, j.catalog);
      if (Array.isArray(j.routine)) SEED.routine = j.routine;
      const sig = JSON.stringify(j);
      const changed = state.centralSig !== sig;
      if (changed) {
        if (Array.isArray(j.events)) merge('events', 'centralEvents', j.events);
        if (Array.isArray(j.resources)) merge('resources', 'centralResources', j.resources);
        state.centralSig = sig;
        persist();
      }
      render();
      if (changed && state.centralSeen) { try { toast('Class data updated'); } catch (e) {} }
      if (changed) { state.centralSeen = true; persist(); }
    })
    .catch(() => {});
})();
</script>
<script>
/* Announcements and class changes (cancel / reschedule / room / make-up), driven by data.json */
(function () {
  let news = { ann: [], changes: [] };
  const mins = (s) => { const p = String(s).split(':').map(Number); return p[0] * 60 + (p[1] || 0); };
  const clk = (m) => { const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'); return ((h + 11) % 12 + 1) + ':' + mm + (h < 12 ? ' AM' : ' PM'); };
  const dlabel = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
  const title = (c) => (SEED.catalog[c] ? SEED.catalog[c].title : c);
  function apply(list) {
    state.overrides = state.overrides || {};
    state.exceptions = (state.exceptions || []).filter((e) => !String(e.id).startsWith('central-'));
    for (const k of state.centralKeys || []) delete state.overrides[k];
    const keys = [];
    for (const c of list) {
      if (!c || !c.date || !c.code) continue;
      if (c.type === 'makeup') {
        state.exceptions.push({ id: 'central-' + c.id, kind: 'Make-up', date: c.date, audience: c.section || 'Both', title: c.code + ' · ' + title(c.code), code: c.code, start: mins(c.start), end: mins(c.end), room: c.room || '', teacher: '', labels: '', cancelled: false });
        continue;
      }
      const wd = new Date(c.date + 'T12:00:00Z').getUTCDay();
      for (const b of SEED.routine) {
        if (b.code !== c.code || b.weekday !== wd) continue;
        if (c.section && c.section !== 'Both' && b.section !== c.section) continue;
        if (c.subgroup && b.subgroup && b.subgroup !== c.subgroup) continue;
        const key = c.date + '/' + b.id; keys.push(key);
        state.overrides[key] = c.type === 'cancel' ? { cancelled: true }
          : Object.assign({}, c.start ? { start: mins(c.start), end: mins(c.end) } : {}, c.room ? { room: c.room } : {});
      }
    }
    state.centralKeys = keys;
  }
  const mine = (c) => { try { return !c.section || c.section === 'Both' || c.section === sec()[0]; } catch (e) { return true; } };
  function changeHtml(c) {
    const what = c.type === 'cancel' ? 'Class cancelled'
      : c.type === 'makeup' ? 'Extra class · ' + clk(mins(c.start)) + '–' + clk(mins(c.end)) + (c.room ? ' · Room ' + c.room : '')
      : c.type === 'room' ? 'Room changed to ' + c.room
      : 'Rescheduled' + (c.start ? ' to ' + clk(mins(c.start)) + '–' + clk(mins(c.end)) : '') + (c.room ? ' · Room ' + c.room : '');
    return '<div class="ceeCard ceeChange ' + (c.type === 'cancel' ? 'cancel' : '') + '"><div class="ceeTag">' + esc(what) + '</div><h3>' + esc(c.code + ' · ' + title(c.code)) + '</h3><p>' + esc(dlabel(c.date) + (c.section && c.section !== 'Both' ? ' · Section ' + c.section : '') + (c.note ? ' · ' + c.note : '')) + '</p></div>';
  }
  function annHtml(a) {
    const link = a.link && /^https?:\/\//i.test(a.link) ? ' <a href="' + esc(a.link) + '" target="_blank" rel="noopener">Open link</a>' : '';
    return '<div class="ceeCard"><div class="ceeTag">' + (a.pinned ? 'Pinned · ' : '') + 'Announcement' + (a.date ? ' · ' + esc(dlabel(a.date)) : '') + '</div><h3>' + esc(a.title || '') + '</h3><p>' + esc(a.body || '') + link + '</p></div>';
  }
  function inject() {
    const m = document.getElementById('main'); if (!m || m.querySelector('#ceeNews')) return;
    const pg = document.body.dataset.page; if (pg !== 'home' && pg !== 'calendar') return;
    const t = today();
    const ch = news.changes.filter((c) => c.date >= t && mine(c)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, pg === 'home' ? 5 : 20);
    const an = pg === 'home' ? news.ann.filter((a) => !a.until || a.until >= t).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(b.date).localeCompare(String(a.date))).slice(0, 3) : [];
    if (!ch.length && !an.length) return;
    const d = document.createElement('div'); d.id = 'ceeNews';
    d.innerHTML = an.map(annHtml).join('') + ch.map(changeHtml).join('');
    const first = m.firstElementChild;
    if (first && first.id === 'ceeWarn') first.after(d); else m.prepend(d);
  }
  const mo = document.getElementById('main');
  if (mo) new MutationObserver(inject).observe(mo, { childList: true });
  const SB = 'https://xmuohwaikhcpeprxwdwe.supabase.co', KEY = 'sb_publishable_QME095fuSvCeCO6HlO36Cw_oqBQHn7G';
  window.__ceeSB = { url: SB, key: KEY };
  const sbGet = (t, q) => fetch(SB + '/rest/v1/' + t + '?' + q, { headers: { apikey: KEY }, cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  function load() {
    return Promise.all([
      fetch('data.json?' + Date.now() + 'b', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
      sbGet('announcements', 'select=*'), sbGet('class_changes', 'select=*'), sbGet('quizzes', 'select=*'),
    ]).then(([j, a, c, q]) => {
      if (a === null || c === null) return;
      j = j || {};
      const fa = (Array.isArray(j.announcements) ? j.announcements : []).concat(a.map((x) => ({ id: 'db-' + x.id, title: x.title, body: x.body, date: x.date, pinned: x.pinned, until: x.until, link: x.link })));
      const fc = (Array.isArray(j.changes) ? j.changes : []).concat(c.map((x) => ({ id: 'db-' + x.id, type: x.type, date: x.date, code: x.code, section: x.section, start: x.start_time, end: x.end_time, room: x.room, note: x.note })));
      news = { ann: fa, changes: fc };
      if (q !== null) {
        const t0 = today();
        const evs = q.filter((x) => x.date >= t0).map((x) => ({ id: 'dbq-' + x.id, code: x.code, date: x.date, title: x.code + ' · ' + title(x.code), kind: 'Quiz', audience: x.section || 'Both', minute: mins(x.start_time || '13:00'), rooms: { A: x.room || '', B: x.room || '' }, lead: 120, syllabus: x.syllabus || '' }));
        const old = state.centralQuizIds || [];
        state.events = (state.events || []).filter((e) => !old.includes(e.id)).concat(evs);
        state.centralQuizIds = evs.map((e) => e.id);
      }
      apply(fc); persist(); render(); inject();
    });
  }
  window.__ceeReload = load;
  load();
})();
</script>
<script>
/* Admin: sign in, post announcements, add class changes (Supabase) */
(function () {
  const { url: SB, key: KEY } = window.__ceeSB;
  const SK = 'cee-admin-session';
  let open = false, msg = '', items = { a: [], c: [], q: [] }, busy = false;
  const ses = () => { try { return JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { return null; } };
  const setSes = (s) => { try { s ? localStorage.setItem(SK, JSON.stringify(s)) : localStorage.removeItem(SK); } catch (e) {} };
  const pack = (d) => ({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000, email: d.user && d.user.email });
  async function token() {
    let s = ses(); if (!s) return null;
    if (s.expires_at - Date.now() < 60000) {
      const r = await fetch(SB + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      if (!r.ok) { setSes(null); return null; }
      s = pack(await r.json()); setSes(s);
    }
    return s.access_token;
  }
  async function api(method, path, body) {
    const t = await token(); if (!t) throw new Error('Please sign in again.');
    const r = await fetch(SB + '/rest/v1/' + path, { method, headers: { apikey: KEY, Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', Prefer: 'return=representation' }, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error('Not saved (' + r.status + '). Check you are an admin.');
    return r.json().catch(() => []);
  }
  async function refreshItems() {
    try { items = { a: await api('GET', 'announcements?select=*&order=created_at.desc&limit=8'), c: await api('GET', 'class_changes?select=*&order=date.desc&limit=10'), q: await api('GET', 'quizzes?select=*&order=date.desc&limit=8').catch(() => []) }; } catch (e) { msg = e.message; }
  }
  async function signIn() {
    const email = document.getElementById('admEmail').value.trim(), pw = document.getElementById('admPw').value;
    msg = 'Signing in...'; paint();
    const r = await fetch(SB + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password: pw }) });
    if (!r.ok) { msg = 'Wrong email or password.'; return paint(); }
    setSes(pack(await r.json()));
    try { const a = await api('GET', 'admins?select=email'); if (!a.length) { setSes(null); msg = 'This account is not an admin.'; return paint(); } } catch (e) { setSes(null); msg = 'Could not check admin access.'; return paint(); }
    msg = ''; await refreshItems(); paint();
  }
  const val = (id) => (document.getElementById(id) || {}).value || '';
  async function save(kind) {
    if (busy) return; busy = true;
    try {
      if (kind === 'ann') {
        if (!val('admTitle').trim()) throw new Error('Add a title.');
        await api('POST', 'announcements', { title: val('admTitle').trim(), body: val('admBody').trim(), link: val('admLink').trim() || null, pinned: document.getElementById('admPin').checked, until: val('admUntil') || null });
      } else if (kind === 'quiz') {
        if (!val('qzDate') || !val('qzCode')) throw new Error('Choose a course and a date.');
        await api('POST', 'quizzes', { code: val('qzCode'), date: val('qzDate'), start_time: val('qzTime') || '13:00', section: val('qzSec'), room: val('qzRoom').trim() || null, syllabus: val('qzSyl').trim() || null });
      } else {
        const type = val('chType'), st = val('chStart'), en = val('chEnd'), room = val('chRoom').trim();
        if (!val('chDate') || !val('chCode')) throw new Error('Choose a date and a course.');
        if ((type === 'makeup' || type === 'reschedule') && (!st || !en) && !(type === 'reschedule' && room)) throw new Error('Add start and end times.');
        if (type === 'room' && !room) throw new Error('Add the new room.');
        await api('POST', 'class_changes', { type, date: val('chDate'), code: val('chCode'), section: val('chSec'), start_time: st || null, end_time: en || null, room: room || null, note: val('chNote').trim() || null });
      }
      msg = 'Posted. Students see it now.'; await refreshItems(); paint(); if (window.__ceeReload) window.__ceeReload();
    } catch (e) { msg = e.message; paint(); } finally { busy = false; }
  }
  async function del(t, id) {
    if (!confirm('Delete this item?')) return;
    try { await api('DELETE', t + '?id=eq.' + id); msg = 'Deleted.'; await refreshItems(); paint(); if (window.__ceeReload) window.__ceeReload(); } catch (e) { msg = e.message; paint(); }
  }
  const o = (arr) => arr.map((x) => '<option>' + esc(x) + '</option>').join('');
  function html() {
    if (!open) return '<h3>Admin</h3><p class="sub">For class admins only.</p><button type="button" class="secondary" data-adm="toggle">Admin sign in</button>';
    const s = ses();
    if (!s) return '<h3>Admin sign in</h3><input id="admEmail" type="email" placeholder="Email" autocomplete="username"><input id="admPw" type="password" placeholder="Password" autocomplete="current-password"><button type="button" data-adm="login">Sign in</button> <button type="button" class="secondary" data-adm="toggle">Close</button><div class="adm-msg">' + esc(msg) + '</div>';
    const codes = Object.keys(SEED.catalog);
    return '<h3>Admin</h3><p class="sub">Signed in as ' + esc(s.email || '') + '</p><div class="adm-msg">' + esc(msg) + '</div>'
      + '<h3>Post an announcement</h3><input id="admTitle" placeholder="Title"><textarea id="admBody" rows="3" placeholder="Message"></textarea><input id="admLink" placeholder="Link (optional)"><div class="row2"><label><input id="admPin" type="checkbox"> Pin to top</label><input id="admUntil" type="date" title="Hide after"></div><button type="button" data-adm="ann">Post announcement</button>'
      + '<h3>Class change</h3><div class="row2"><select id="chType">' + o(['cancel', 'reschedule', 'room', 'makeup']) + '</select><select id="chSec">' + o(['Both', 'A', 'B']) + '</select></div><select id="chCode">' + o(codes) + '</select><input id="chDate" type="date"><div class="row2"><input id="chStart" type="time" title="Start"><input id="chEnd" type="time" title="End"></div><input id="chRoom" placeholder="Room (optional)"><input id="chNote" placeholder="Note (optional)"><button type="button" data-adm="chg">Post class change</button>'
      + '<h3>Add a quiz</h3><select id="qzCode">' + o(codes) + '</select><div class="row2"><input id="qzDate" type="date"><input id="qzTime" type="time" value="13:00"></div><div class="row2"><select id="qzSec">' + o(['Both', 'A', 'B']) + '</select><input id="qzRoom" placeholder="Room"></div><textarea id="qzSyl" rows="2" placeholder="Syllabus (optional)"></textarea><button type="button" data-adm="quiz">Add quiz</button>'
      + '<h3>Recent posts</h3>' + items.q.map((x) => '<div class="adm-item"><span>' + esc('quiz · ' + x.code + ' · ' + x.date) + '</span><button type="button" class="secondary" data-adm="delq" data-id="' + x.id + '">Delete</button></div>').join('') + + (items.a.map((x) => '<div class="adm-item"><span>' + esc(x.title) + '</span><button type="button" class="secondary" data-adm="dela" data-id="' + x.id + '">Delete</button></div>').join('') + items.c.map((x) => '<div class="adm-item"><span>' + esc(x.type + ' · ' + x.code + ' · ' + x.date) + '</span><button type="button" class="secondary" data-adm="delc" data-id="' + x.id + '">Delete</button></div>').join('') || '<p class="sub">Nothing yet.</p>')
      + '<button type="button" class="secondary" data-adm="out">Sign out</button>';
  }
  function paint() { const d = document.getElementById('ceeAdmin'); if (d) d.innerHTML = html(); }
  function inject() {
    const m = document.getElementById('main');
    if (!m || document.body.dataset.page !== 'settings' || m.querySelector('#ceeAdmin')) return;
    const d = document.createElement('div'); d.id = 'ceeAdmin'; d.className = 'card stack'; d.innerHTML = html(); m.append(d);
  }
  document.addEventListener('click', async (e) => {
    const b = e.target.closest && e.target.closest('[data-adm]'); if (!b) return;
    const k = b.dataset.adm;
    if (k === 'toggle') { open = !open; msg = ''; if (open && ses()) await refreshItems(); paint(); }
    else if (k === 'login') signIn();
    else if (k === 'ann') save('ann');
    else if (k === 'chg') save('chg');
    else if (k === 'quiz') save('quiz');
    else if (k === 'delq') del('quizzes', b.dataset.id);
    else if (k === 'dela') del('announcements', b.dataset.id);
    else if (k === 'delc') del('class_changes', b.dataset.id);
    else if (k === 'out') { setSes(null); msg = ''; open = false; paint(); }
  });
  const m = document.getElementById('main');
  if (m) new MutationObserver(inject).observe(m, { childList: true });
  inject();
})();
</script>
